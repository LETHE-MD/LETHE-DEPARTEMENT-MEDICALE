<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091522"><meta name="color-scheme" content="dark"><meta name="description" content="Portail médical LETHE — application roleplay adaptative"><title>LETHE v1.1.1 — Département médical</title>
<style>
:root{--bg:#08131f;--panel:#101f2e;--panel2:#15283a;--line:#294156;--txt:#e8f0f6;--muted:#91a7b9;--cyan:#64c6d5;--gold:#d5b36a;--red:#d96b6b;--green:#69bd91;--shadow:0 12px 32px #0005}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% -10%,#18344a 0,transparent 42%),var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#08131feF;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.brand{display:flex;gap:11px;align-items:center;font-weight:800;letter-spacing:.16em}.sigil{width:34px;height:34px;border:1px solid var(--cyan);color:var(--cyan);display:grid;place-items:center;border-radius:9px;font-weight:900}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.2em;font-weight:600}
.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 64px)}
.sidebar{border-right:1px solid var(--line);padding:18px 12px;background:#0b1926}.side-label{color:#71899d;font-size:10px;letter-spacing:.18em;margin:14px 10px 7px}
.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;color:#b7c7d4;border:1px solid transparent;margin:3px 0;text-align:left;width:100%;background:transparent}
.nav:hover,.nav.active{background:#193247;border-color:#31566d;color:white}.nav .ico{width:18px;color:var(--cyan);text-align:center}
main{padding:24px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:22px}
.eyebrow{color:var(--cyan);font-size:10px;letter-spacing:.22em;text-transform:uppercase}.page-head h1{font-size:25px;margin:4px 0 3px;letter-spacing:.02em}.sub{color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,#132638,#0f1d2b);border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow);min-width:0}
.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.stat{font-size:28px;font-weight:750;margin-top:5px}.muted{color:var(--muted)}.card h3{margin:0 0 12px;font-size:14px;letter-spacing:.04em}
.btn{border:1px solid #426177;background:#1b3549;color:#eaf4fa;padding:9px 13px;border-radius:8px;font-weight:650}.btn:hover{background:#24475e}.btn.primary{background:#1d5967;border-color:#397f8c}.btn.gold{background:#57482c;border-color:#8b7442}.btn.danger{background:#542d35;border-color:#8e4a55}.btn.ghost{background:transparent}.btn.small{padding:6px 9px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:11px;color:#a9bdcc;letter-spacing:.06em;text-transform:uppercase}.field input,.field select,.field textarea,.search{width:100%;background:#091724;border:1px solid #314b60;border-radius:7px;color:var(--txt);padding:10px 11px;outline:none;min-width:0}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #64c6d522}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.formgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.full{grid-column:1/-1}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--cyan);font-size:11px;letter-spacing:.15em;text-transform:uppercase}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:10px;border-bottom:1px solid #263c4e;text-align:left}th{font-size:10px;color:#8da6b8;text-transform:uppercase;letter-spacing:.1em}td{font-size:13px}
.tag{display:inline-flex;padding:3px 7px;border:1px solid #456176;border-radius:20px;color:#b8dce4;font-size:10px;white-space:nowrap}.tag.red{border-color:#9b4d58;color:#ffb0b0}.tag.gold{border-color:#8b7442;color:#e5cb8b}
.notice{border-left:3px solid var(--gold);padding:10px 12px;background:#3b3221;color:#ead8ad;border-radius:4px;font-size:12px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#1c3c50 0,transparent 55%),#07111c}
.loginbox{width:min(430px,100%);padding:28px;background:#102131;border:1px solid #355267;border-radius:16px;box-shadow:0 25px 80px #0009}.loginbox .brand{justify-content:center;margin-bottom:25px}.loginbox h1{text-align:center;font-size:19px;letter-spacing:.13em}.loginbox p{text-align:center;color:var(--muted);font-size:12px}
.mobilebar{display:none}.pill{border:1px solid var(--line);padding:5px 8px;border-radius:20px;color:var(--muted);font-size:11px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:8px 11px;background:#0b1926;border:1px solid var(--line);border-radius:7px;color:#a9bdcc}.tab.active{background:#1c4657;border-color:#4d8998;color:white}
.checks{display:flex;flex-wrap:wrap;gap:8px}.check{display:inline-flex;gap:7px;align-items:center;padding:7px 9px;border:1px solid #2d4559;border-radius:7px;background:#0b1926;color:#c6d4de;font-size:12px}.check input{accent-color:#64c6d5}
.letter-nav{display:flex;flex-direction:column;gap:5px;position:sticky;top:84px;align-self:start}.letter-nav button{width:44px;height:42px;border-radius:8px;border:1px solid var(--line);background:#0d1d2b;color:var(--cyan);font-weight:800}.letter-nav button.active{background:#1d5867;color:white}
.bilan-layout{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px}.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bodymap .map{border:1px solid var(--line);border-radius:9px;padding:12px;text-align:center;min-height:170px;background:#0b1926}
.bodymap button{margin:3px;padding:5px 7px;font-size:10px}
footer{padding:25px;color:#60798d;text-align:center;font-size:10px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.mobilebar{display:flex;gap:6px;overflow:auto;padding:8px;background:#0b1926;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:4}.mobilebar .nav{white-space:nowrap;width:auto;margin:0;padding:8px 10px;font-size:12px}.span-3{grid-column:span 6}.span-4{grid-column:span 6}.span-8{grid-column:span 12}main{padding:16px}}
@media(max-width:560px){.span-3,.span-4,.span-6{grid-column:span 12}.formgrid,.formgrid.three,.formgrid.four{grid-template-columns:1fr}.page-head{flex-direction:column}.page-head h1{font-size:21px}.topbar{height:58px}.mobilebar{top:58px}.bilan-layout{grid-template-columns:1fr}.letter-nav{position:static;flex-direction:row;overflow:auto}.letter-nav button{min-width:40px}.bodymap{grid-template-columns:1fr 1fr}}
@media print{body{background:white;color:#111}.topbar,.sidebar,.mobilebar,.no-print,button{display:none!important}.shell{display:block}main{padding:0;max-width:none}.card{background:white;color:#111;border:1px solid #aaa;box-shadow:none;break-inside:avoid}.field label,.muted,.sub{color:#333}.field input,.field textarea,.field select{background:white;color:#111;border:1px solid #999}.tag{color:#111;border-color:#777}.page-head h1{color:#111}}

/* Interface adaptative : mobile / tablette / ordinateur */
html{scroll-behavior:smooth}body{min-width:300px}button,input,select,textarea{touch-action:manipulation}
:focus-visible{outline:3px solid var(--cyan)!important;outline-offset:3px}
.skip-link{position:absolute;top:-100px;left:12px;z-index:50;background:var(--cyan);color:#08131f;padding:12px;border-radius:8px}.skip-link:focus{top:10px}
#deviceLabel{color:var(--muted);font-size:11px;white-space:nowrap}
.device-controls{display:flex;align-items:center;gap:7px}.device-controls select{max-width:116px;background:#10283a;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:7px}
#mobileNav{scrollbar-width:thin;scroll-snap-type:x proximity}#mobileNav .nav{scroll-snap-align:start}
#mobileNav .nav.active{border-bottom:2px solid var(--cyan)}
.card{transition:border-color .15s ease}.card:hover{border-color:#3b5b70}
#content{animation:appear .15s ease}@keyframes appear{from{opacity:.7;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;right:16px;bottom:18px;z-index:99;background:#183a45;border:1px solid #5d9ea9;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:min(400px,90vw)}
@media(min-width:901px) and (max-width:1199px){.shell{grid-template-columns:205px minmax(0,1fr)}main{padding:19px}.sidebar{padding:14px 8px}.nav{padding:10px 8px}}
@media(min-width:561px) and (max-width:900px){main{padding:20px}.formgrid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){
 body{font-size:14px}.topbar{padding:0 10px;gap:8px}.topbar .brand{letter-spacing:.07em;font-size:12px}.topbar .brand small{font-size:7px}
 .topbar .pill{display:none}.topbar .actions{gap:5px}.device-controls select{max-width:83px;font-size:11px;padding:6px 3px}
 .mobilebar{padding:7px 8px;gap:5px}.mobilebar .nav{min-height:42px;padding:9px 11px}
 main{padding:12px}.card{padding:13px;border-radius:10px}.page-head{margin-bottom:14px}
 .btn{min-height:40px}.btn.small{min-height:36px}.actions{gap:7px}
 .formgrid{gap:10px}.field input,.field select,.field textarea{font-size:16px}
 .tablewrap{margin-inline:-7px}table{min-width:560px}
 .loginbox{padding:20px}.bodymap{grid-template-columns:1fr}
 .toast{left:10px;right:10px;bottom:12px}
}
@media(max-width:390px){.topbar .brand small{display:none}.sigil{width:29px;height:29px}.device-controls select{max-width:72px}}
@media(hover:none){.nav,.btn{min-height:42px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
body[data-layout="mobile"] .shell,body[data-layout="tablet"] .shell{grid-template-columns:1fr}
body[data-layout="mobile"] .sidebar,body[data-layout="tablet"] .sidebar{display:none}
body[data-layout="mobile"] .mobilebar,body[data-layout="tablet"] .mobilebar{display:flex}
body[data-layout="mobile"] .formgrid,body[data-layout="mobile"] .formgrid.three,body[data-layout="mobile"] .formgrid.four{grid-template-columns:1fr}
body[data-layout="mobile"] .span-3,body[data-layout="mobile"] .span-4,body[data-layout="mobile"] .span-6,body[data-layout="tablet"] .span-3{grid-column:span 12}
body[data-layout="mobile"] main{max-width:620px;padding:12px}
body[data-layout="tablet"] main{max-width:1000px}
@media print{.device-controls,.toast,.skip-link{display:none!important}}

/* LETHE ergonomie */
:root{--scale:1}body{font-size:calc(14px * var(--scale))}body[data-font="large"]{--scale:1.16}body[data-font="extra"]{--scale:1.3}
body[data-contrast="high"]{--muted:#e1e9f0;--line:#7697ac;--cyan:#a5f5ff;--txt:#fff}
body[data-density="compact"] .card{padding:10px}body[data-density="compact"] td,body[data-density="compact"] th{padding:5px}body[data-density="compact"] .nav{padding:7px}
body[data-density="comfortable"] .card{padding:23px}body[data-density="comfortable"] .nav{padding:15px}
#uxBar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px;margin:0 0 15px;background:#10283a;border:1px solid var(--line);border-radius:9px}
#uxBar button,#uxBar select{background:#1b394d;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:8px;min-height:37px}
#uxBar .grow{flex:1}#uxBar button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
#uxCrumb{color:var(--muted);font-size:12px;margin-bottom:8px}#uxCrumb button{color:var(--cyan);background:none;border:0;cursor:pointer}
#uxHelp{background:#143247;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}#uxHelp[hidden]{display:none}
#patientCount{font-size:12px;color:var(--muted);margin:8px 0}#uxBar select{max-width:150px}
.nav[aria-current="page"]{box-shadow:inset 3px 0 var(--cyan)}.ux-star{color:var(--gold)}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(max-width:600px){#uxBar{padding:7px;gap:5px}#uxBar button,#uxBar select{font-size:11px;padding:6px;min-height:42px}#uxBar select{max-width:100px}}
@media print{#uxBar,#uxHelp,#uxCrumb{display:none!important}}
</style>
<meta name="application-name" content="LETHE v1.1.1"><meta name="description" content="LETHE v1.1.1 — Portail médical de simulation RP, fichier HTML autonome."></head>
<body><a class="skip-link" href="#main">Aller au contenu</a>
<div id="loginScreen" class="login">
 <div class="loginbox">
  <div class="brand"><div class="sigil">L</div><div>LETHE<small>DÉPARTEMENT MÉDICAL</small></div></div>
  <div class="eyebrow" style="text-align:center">SYSTÈME INTERNE · ACCÈS CONTRÔLÉ</div>
  <h1>AUTHENTIFICATION REQUISE</h1><p>Veuillez présenter vos identifiants d'habilitation.</p>
  <form id="loginForm" class="formgrid" style="grid-template-columns:1fr;margin-top:22px">
   <div class="field"><label>Identifiant</label><input id="loginUser" autocomplete="username" required></div>
   <div class="field"><label>Mot de passe</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
   <div class="full"><button class="btn primary" style="width:100%">Ouvrir la session</button></div>
   <div id="loginError" class="full" style="color:#ff9b9b;text-align:center"></div>
  </form>
  <p style="margin-top:20px">LETHE // Réseau local de l'établissement</p>
 </div>
</div>
<div id="app" class="hidden">
<header class="topbar"><div class="brand"><div class="sigil">L</div><div>LETHE<small>DÉPARTEMENT MÉDICAL</small></div></div><div class="actions"><span class="pill" id="whoami"></span><div class="device-controls"><select id="layoutChoice" aria-label="Version de l’interface" onchange="setLayout(this.value)" title="Choisir une version d’affichage"><option value="auto">Auto</option><option value="desktop">PC</option><option value="tablet">Tablette</option><option value="mobile">Mobile</option></select></div><button class="btn small ghost" onclick="logout()">Déconnexion</button></div></header>
<div class="mobilebar" id="mobileNav"></div>
<div class="shell"><aside class="sidebar" id="sideNav"></aside><main id="main" tabindex="-1"></main></div>
<footer>LETHE · SYSTÈME DE GESTION INTERNE · ENVIRONNEMENT ROLEPLAY</footer>
</div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,d=[])=>{try{return JSON.parse(localStorage.getItem('lethe_'+k))??d}catch{return d}}, write=(k,v)=>localStorage.setItem('lethe_'+k,JSON.stringify(v));
let users=read('users',[{id:1,user:'admin',pass:'LETHE-DEMO-2026',name:'Administrateur LETHE',role:'Administrateur'}]);
let patients=read('patients',[]), appointments=read('appointments',[]), pecs=read('pecs',[]), notifications=read('notifications',[]);
let current=null, page='home', activeBilan='CI', activePEC=null;

const layoutPreferenceKey='lethe_layout_preference';
function setLayout(mode){
 const value=['auto','desktop','tablet','mobile'].includes(mode)?mode:'auto';
 document.body.dataset.layout=value;
 localStorage.setItem(layoutPreferenceKey,value);
 const select=$('#layoutChoice');if(select)select.value=value;
}
function initLayout(){setLayout(localStorage.getItem(layoutPreferenceKey)||'auto')}
function notify(message){
 let old=$('#letheToast');if(old)old.remove();
 const box=document.createElement('div');box.id='letheToast';box.className='toast';box.setAttribute('role','status');box.textContent=message;document.body.appendChild(box);
 setTimeout(()=>{if(box.isConnected)box.remove()},3500);
}
function exportBackup(){
 if(!current)return;
 const data={version:2,exportedAt:new Date().toISOString(),patients,appointments,pecs,notifications,auditLog};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='LETHE_sauvegarde_RP_'+new Date().toISOString().slice(0,10)+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Sauvegarde exportée sur cet appareil.');
}
function importBackup(event){
 if(!canAdmin())return;
 const file=event.target.files?.[0];if(!file)return;
 file.text().then(text=>{
  const data=JSON.parse(text);
  if(!Array.isArray(data.patients)||!Array.isArray(data.appointments)||!Array.isArray(data.pecs)||!Array.isArray(data.notifications))throw Error('Format invalide');
  if(!confirm('Remplacer les dossiers, rendez-vous, PEC et notifications locaux par cette sauvegarde ?'))return;
  patients=data.patients;appointments=data.appointments;pecs=data.pecs;notifications=data.notifications;
  saveAll();if(Array.isArray(data.auditLog)){auditLog=data.auditLog;write('auditLog',auditLog)}go('home');notify('Sauvegarde restaurée.');
 }).catch(()=>alert('Fichier de sauvegarde invalide.')).finally(()=>{event.target.value=''});
}
document.addEventListener('keydown',event=>{
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'&&current){
  event.preventDefault();go('patients');$('#patientSearch')?.focus();
 }
 if(event.key==='Escape'&&$('#symptomInput')===document.activeElement){$('#symptomInput').blur()}
});

// Ergonomie : préférences, favoris, historique et raccourcis.
const UX_STORAGE='lethe_ergonomie_20';
let uxPrefs={font:'normal',contrast:'normal',density:'normal',favorites:[],recent:[],help:false,...JSON.parse(localStorage.getItem(UX_STORAGE)||'{}')};
let uxBackStack=[];
function uxSave(){localStorage.setItem(UX_STORAGE,JSON.stringify(uxPrefs))}
function uxApply(){document.body.dataset.font=uxPrefs.font;document.body.dataset.contrast=uxPrefs.contrast;document.body.dataset.density=uxPrefs.density}
function uxSet(key,value){uxPrefs[key]=value;uxSave();uxApply();uxRenderBar();}
function uxFav(){uxPrefs.favorites=uxPrefs.favorites.includes(page)?uxPrefs.favorites.filter(x=>x!==page):[...uxPrefs.favorites,page];uxSave();renderNav();uxRenderBar()}
function uxBack(){const previous=uxBackStack.pop();go(previous||'home',true)}
function uxRenderBar(){
 const bar=$('#uxBar');if(!bar)return;
 const allowed=navItems.filter(([id])=>(id!=='profiles'||canAdmin())&&(id!=='audit'||canSeeAudit())&&(!['medications','diagnostics'].includes(id)||canDoctor()));
 bar.innerHTML=`<button onclick="uxBack()" title="Revenir à la page précédente">← Retour</button><button onclick="go('home')">⌂ Accueil</button><button onclick="uxFav()" aria-pressed="${uxPrefs.favorites.includes(page)}" title="Ajouter aux favoris">${uxPrefs.favorites.includes(page)?'★':'☆'} Favori</button><select aria-label="Accès rapide" onchange="if(this.value)go(this.value)"><option value="">Aller à…</option>${allowed.map(([id,ic,n])=>`<option value="${id}">${uxPrefs.favorites.includes(id)?'★ ':''}${n}</option>`).join('')}</select><span class="grow"></span><select aria-label="Taille du texte" onchange="uxSet('font',this.value)"><option value="normal" ${uxPrefs.font==='normal'?'selected':''}>Texte normal</option><option value="large" ${uxPrefs.font==='large'?'selected':''}>Texte +</option><option value="extra" ${uxPrefs.font==='extra'?'selected':''}>Texte ++</option></select><button aria-pressed="${uxPrefs.contrast==='high'}" onclick="uxSet('contrast',uxPrefs.contrast==='high'?'normal':'high')">◐ Contraste</button><select aria-label="Densité de l'interface" onchange="uxSet('density',this.value)"><option value="normal" ${uxPrefs.density==='normal'?'selected':''}>Standard</option><option value="compact" ${uxPrefs.density==='compact'?'selected':''}>Compact</option><option value="comfortable" ${uxPrefs.density==='comfortable'?'selected':''}>Espacé</option></select><button aria-expanded="${uxPrefs.help}" onclick="uxSet('help',!uxPrefs.help)">? Aide</button>`;
 const help=$('#uxHelp');if(help){help.hidden=!uxPrefs.help;help.innerHTML='<b>Raccourcis</b><p>Ctrl/⌘ + K : dossiers patients · Alt + ← : page précédente · Alt + H : accueil · Échap : quitter la recherche.</p><p>Les préférences sont mémorisées sur cet appareil.</p>'}
}
function uxDecorate(){
 const main=$('#main'),head=main?.querySelector('.page-head');if(!head)return;
 const crumb=document.createElement('div');crumb.id='uxCrumb';crumb.innerHTML=`<button onclick="go('home')">Accueil</button> / ${esc(head.querySelector('h1')?.textContent||'')}`;head.before(crumb);
 const bar=document.createElement('div');bar.id='uxBar';bar.setAttribute('role','toolbar');bar.setAttribute('aria-label','Outils de navigation et accessibilité');head.after(bar);
 const help=document.createElement('div');help.id='uxHelp';help.hidden=true;bar.after(help);
 uxRenderBar();document.title='LETHE · '+(head.querySelector('h1')?.textContent||'Département médical');window.scrollTo(0,0);
}
document.addEventListener('keydown',event=>{if(!current)return;if(event.altKey&&event.key==='ArrowLeft'){event.preventDefault();uxBack()}if(event.altKey&&event.key.toLowerCase()==='h'){event.preventDefault();go('home')}if(event.key==='Escape'&&['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))document.activeElement.blur()});
uxApply();

const roles=['Direction','Superviseur','Médecin','Infirmier','Interne','Pharmacien'];
const canAdmin=()=>current?.role==='Administrateur';
const canDoctor=()=>current?.role==='Médecin'||canAdmin();
const canRecordMedication=()=>['Administrateur','Médecin','Infirmier'].includes(current?.role);
const canPrescribe=()=>['Administrateur','Médecin'].includes(current?.role);

function auditEvent(action,type,id,detail){
 if(!current)return;
 auditLog.push({id:Date.now()+Math.random(),at:new Date().toISOString(),actorId:current.id,actor:current.name,role:current.role,action,type,recordId:id,detail});
 if(auditLog.length>3000)auditLog=auditLog.slice(-3000);
 write('auditLog',auditLog);
}
function auditChanges(type,before,after){
 const old=new Map(before.map(x=>[String(x.id),x]));
 const fresh=new Map(after.map(x=>[String(x.id),x]));
 for(const [id,obj] of fresh){
  const prev=old.get(id);
  if(!prev){auditEvent('Création',type,id,type==='PEC'?(obj.urgent?'Prise en charge urgente':'Prise en charge standard'):'Nouvelle fiche');continue}
  const ignored=['updatedAt','lastModified'];
  const fields=[...new Set([...Object.keys(prev),...Object.keys(obj)])].filter(k=>!ignored.includes(k)&&JSON.stringify(prev[k])!==JSON.stringify(obj[k]));
  if(fields.length)auditEvent('Modification',type,id,'Champs modifiés : '+fields.join(', ').slice(0,360));
 }
 for(const [id] of old)if(!fresh.has(id))auditEvent('Suppression',type,id,'Enregistrement supprimé');
}
function saveAll(){
 for(const [key,type] of [['patients','Patient'],['pecs','PEC'],['appointments','Rendez-vous']]){
  const before=JSON.parse(auditPrevious[key]||'[]'),after=({patients,pecs,appointments})[key];
  auditChanges(type,before,after);
  auditPrevious[key]=JSON.stringify(after);
 }
 write('users',users);write('patients',patients);write('appointments',appointments);write('pecs',pecs);write('notifications',notifications);
}

}

function medicalRecordSection(p){
 if(!canRecordMedication()&&!canPharmacy())return '';
 const prescriptions=p.prescriptions||[], administrations=p.administrations||[];
 const active=prescriptions.filter(x=>x.status==='Active'&&(!x.validUntil||x.validUntil>=new Date().toISOString().slice(0,10))&&x.pharmacyReview!=='Refusée');
 return `<div class="card span-12"><div class="actions" style="justify-content:space-between;align-items:center"><h3>ORDONNANCES · SUIVI MÉDICAMENTEUX RP</h3><span class="tag">${prescriptions.length} ordonnance(s)</span></div>
 <p class="muted">Journal de simulation pour le jeu de rôle. Ne pas y saisir de données médicales réelles. Aucun dosage ni protocole d'injection n'est fourni.</p>
 ${canPrescribe()?`<div class="actions"><button class="btn primary" onclick="prescriptionForm(${p.id})">＋ Ajouter une ordonnance</button></div>`:''}
 <div class="tablewrap"><table><thead><tr><th>Date</th><th>Molécule / médicament</th><th>Voie</th><th>Prescripteur</th><th>Validité</th><th>Statut</th><th>Action</th></tr></thead><tbody>
 ${prescriptions.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.medication)}</td><td>${esc(x.route)}</td><td>${esc(x.author)}</td><td>${esc(x.validUntil||'Non définie')}</td><td>${esc(x.status)}${x.pharmacyReview?' · '+esc(x.pharmacyReview):''}</td><td>${canPrescribe()&&x.status==='Active'?`<button class="btn small" onclick="closePrescription(${p.id},${x.id})">Clôturer</button>`:''}${canPharmacy()?` <button class="btn small" onclick="reviewPrescription(${p.id},${x.id})">Avis pharmacie</button>`:''}${canRenewPrescription(p)?` <button class="btn small gold" onclick="renewPrescription(${p.id},${x.id})">Renouveler</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">Aucune ordonnance enregistrée.</td></tr>'}</tbody></table></div>
 <div class="section-title">ADMINISTRATIONS DE MÉDICAMENTS</div>
 <p class="muted">Une administration ne peut être enregistrée qu'en référence à une ordonnance active du dossier.</p>
 ${active.length&&canRecordMedication()?`<button class="btn primary" onclick="administrationForm(${p.id})">＋ Consigner une administration</button>`:'<p class="notice">Aucune ordonnance active : l’enregistrement d’administration est indisponible.</p>'}
 <div class="tablewrap"><table><thead><tr><th>Date / heure</th><th>Médicament</th><th>Voie</th><th>Intervenant</th><th>Observation RP</th></tr></thead><tbody>${administrations.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.medication)}</td><td>${esc(x.route)}</td><td>${esc(x.author)}</td><td>${esc(x.note)}</td></tr>`).join('')||'<tr><td colspan="5">Aucune administration consignée.</td></tr>'}</tbody></table></div></div>`;
}
const rxMolecules=()=>[...new Set(medicationCatalog.flatMap(c=>String(c[2]).split(/[,;]/).map(x=>x.trim().replace(/\s*\([^)]*\)/g,'')).filter(x=>x.length>2)))].sort((a,b)=>a.localeCompare(b,'fr'));
function rxSuggest(){

}

function prescriptionForm(id,renewFrom=null){
 if(!canPrescribe())return;
 const p=patients.find(x=>x.id===id);if(!p)return;

 <p class="muted">Simulation documentaire uniquement. Les doses réelles dépendent de l'indication, de la présentation, de l'âge, du poids, des fonctions rénale et hépatique et des interactions. Aucune dose recommandée automatiquement.</p>
 <div class="formgrid">

 <p class="muted full">La dose et la durée thérapeutique ne peuvent pas être déterminées à partir de la molécule seule. Champs modifiables après validation du prescripteur.</p><div class="field full"><label for="rxNote">Motif et observations RP</label><textarea id="rxNote" maxlength="1000"></textarea></div>

function savePrescription(id){
 if(!canPrescribe())return;
 const p=patients.find(x=>x.id===id),drug=$('#rxDrug')?.value.trim(),valid=$('#rxValidity')?.value;
 if(!p||!drug){alert('Renseignez le médicament.');return}
 const renewedFrom=$('#rxRenewFrom')?.value||'';
 if(renewedFrom&&(!canRenewPrescription(p)||!p.prescriptions?.some(x=>String(x.id)===renewedFrom))){alert('Renouvellement réservé au médecin traitant.');return}
 const durationDays=$('#rxDays')?.value||'';
 if(durationDays&&(!Number.isInteger(Number(durationDays))||Number(durationDays)<1||Number(durationDays)>3650)){alert('Durée invalide.');return}
 if(!valid){alert('Indiquez une date de fin de validité.');return}
 if(valid<new Date().toISOString().slice(0,10)){alert('La validité ne peut pas être passée.');return}
 p.prescriptions=p.prescriptions||[];
 p.prescriptions.push({id:Date.now(),date:new Date().toLocaleString('fr-FR'),medication:drug,route:$('#rxRoute').value,dose:$('#rxDose').value.trim(),durationDays:durationDays?Number(durationDays):null,renewedFrom:renewedFrom||null,validUntil:valid,note:$('#rxNote').value,author:current.name,status:'Active',pharmacyReview:'En attente'});
 saveAll();patientDetail(id);notify('Ordonnance RP enregistrée.');
}
function reviewPrescription(patientId,rxId){
 if(!canPharmacy())return;
 const p=patients.find(x=>x.id===patientId),rx=p?.prescriptions?.find(x=>x.id===rxId);if(!rx)return;
 const choice=prompt('Avis pharmaceutique RP : saisir « Vérifiée », « À clarifier » ou « Refusée ».','À clarifier');

function renderBilan(p){let c=$('#content');c.innerHTML=`<div class="card"><div class="actions" style="justify-content:space-between"><div><div class="eyebrow">BILAN AVANCÉ · ${esc(p.ref||p.patientName)}</div><h3 style="margin:5px 0">${esc(p.patientName)}</h3></div><button class="btn small" onclick="view${p.urgent?'Urgent':'PEC'}(${p.id})">Fermer</button></div><div class="bilan-layout"><div class="letter-nav">${bilanSections.map(k=>`<button class="${activeBilan===k?'active':''}" onclick="activeBilan='${k}';renderBilan(pecs.find(x=>x.id===${p.id}))">${k}</button>`).join('')}</div><div><div class="section-title">${activeBilan} · ${bilanTitles[activeBilan]}</div><div id="bilanForm">${bilanContent(activeBilan,p)}</div><div class="actions no-print" style="margin-top:16px"><button class="btn primary" onclick="saveBilan(${p.id})">Enregistrer cette rubrique</button><button class="btn" onclick="print()">Imprimer</button></div></div></div></div>`;loadBilanValues(p)}
function bilanContent(k,p){if(k==='CI')return `<div class="formgrid"><div class="field full"><label>Sécurité — justification (obligatoire si une case est cochée)</label><textarea id="bSafety"></textarea></div>${groupHTML('CI Sécurité')}<div class="field full"><label>Scène — accès</label><textarea id="bAccess"></textarea></div><div class="field full"><label>Scène — que s’est-il passé ?</label><textarea id="bScene"></textarea></div>${groupHTML('CI Scène')}<div class="field full"><label>Situation — plainte(s) principale(s)</label><textarea id="bComplaint"></textarea></div>${groupHTML('CI Situation')}</div>`;
if(k==='I')return `<div class="formgrid"><div class="field"><label>Nom</label><input id="bLast" value="${esc(p.last)}"></div><div class="field"><label>Prénom</label><input id="bFirst" value="${esc(p.first)}"></div>${inputField('Nom de jeune fille','bMaiden')}<div class="field"><label>Date de naissance</label><input id="bDob" type="date" value="${esc(p.dob)}"></div>${inputField('Adresse','bAddress')}${inputField('Code postal','bPostal')}${inputField('Ville','bTown')}${inputField('Téléphone','bPhone')}<div class="field full"><label>Personne à prévenir — nom et prénom</label><input id="bContact"></div>${textField('Notes personne à prévenir','bContactNotes',true)}</div>`;
if(k==='AB')return `<div class="formgrid">${groupHTML('AB Obstruction')}${groupHTML('AB Libération')}${groupHTML('AB Respiration')}${groupHTML('AB Visuel')}${groupHTML('AB Bruits')}${groupHTML('AB Parole / attitude')}${groupHTML('AB Enfant')}<div class="field"><label>Mouvements par minute</label><input id="bRR" inputmode="numeric" maxlength="2"></div>${groupHTML('AB Mouvement')}<div class="field"><label>Saturation SpO₂ (%) — indisponible en cas d’intoxication au gaz</label><input id="bSpo" placeholder="XX %"></div><div class="field"><label>O₂ — indication de débit (L/min)</label><input id="bO2"></div>${textField('Signes observés — notes','bAirNotes',true)}</div>`;
if(k==='XC')return `<div class="formgrid">${groupHTML('XC Hémorragies')}<div class="field"><label>Heure de pose pansement / garrot</label><input id="bTourTime" type="time"></div>${groupHTML('XC Pouls')}<div class="field full"><label>ACR — éléments consignés (si ACR sélectionné)</label><div class="checks">${groupHTML('XC ACR')}</div></div><div class="field"><label>Heure du choc DAE (si concerné)</label><input id="bShockTime" type="time"></div><div class="field"><label>Nombre d’analyses DAE</label><input id="bAnalyses" type="number"></div><div class="field"><label>Insufflations par cycle (BAVU)</label><input id="bBavu" type="number"></div><div class="field"><label>Compressions par cycle</label><input id="bCompressions" type="number"></div>${groupHTML('XC Visuel')}${groupHTML('XC Palpation')}${groupHTML('XC Parole / attitude')}<div class="field"><label>Battements par minute</label><input id="bPulse" maxlength="2"></div>${groupHTML('XC Pouls mesuré')}${groupHTML('XC Caractéristiques')}<div class="field"><label>Tension (mmHg) — xxx Dia / xxx Sys</label><input id="bBP" placeholder="000 Dia / 000 Sys"></div><div class="field"><label>TRC</label><div class="checks"><label class="check"><input type="radio" name="bTRC" value="< 2 sec"> &lt; 2 sec</label><label class="check"><input type="radio" name="bTRC" value="> 2 sec"> &gt; 2 sec</label></div></div>${textField('Signes observés — notes','bCircNotes',true)}</div>`;
if(k==='D')return `<div class="formgrid">${groupHTML('D Intoxication')}${groupHTML('D Voie')}<div class="field"><label>Autre substance / dosage déclaré</label><textarea id="bSubstance"></textarea></div><div class="field"><label>Inconscience</label><select id="bUnconscious"><option>Non renseigné</option><option>Oui</option><option>Non</option></select></div>${groupHTML('D Visuel')}${groupHTML('D Parole / attitude')}${groupHTML('D Pupilles')}<div class="field full"><label>Sensimotricité — cocher les fonctions conservées</label><div class="checks">${['Mains G','Mains D','Bras G','Bras D','Jambes G','Jambes D','Pieds G','Pieds D','Dos','Thorax','Abdomen','Lombaires'].map(v=>`<label class="check"><input type="checkbox" data-group="D Sensimotricité" value="${v}">${v}</label>`).join('')}</div></div><div class="field full"><label>Score de Glasgow — ouverture des yeux</label><select id="gEye" onchange="calcGlasgow()"><option value="">Non renseigné</option><option value="4">Spontanée (4)</option><option value="3">À la demande (3)</option><option value="2">À la douleur (2)</option><option value="1">Aucune (1)</option></select></div><div class="field"><label>Réponse motrice</label><select id="gMotor" onchange="calcGlasgow()"><option value="">Non renseigné</option><option value="6">À la demande (6)</option><option value="5">Orientée à la douleur (5)</option><option value="4">Évitement non adapté (4)</option><option value="3">Décortication (3)</option><option value="2">Décérébration (2)</option><option value="1">Aucune (1)</option></select></div><div class="field"><label>Réponse verbale</label><select id="gVerbal" onchange="calcGlasgow()"><option value="">Non renseigné</option><option value="5">Orientée (5)</option><option value="4">Confuse (4)</option><option value="3">Inappropriée (3)</option><option value="2">Incompréhensible (2)</option><option value="1">Aucune (1)</option></select></div><div class="field"><label>Glasgow calculé</label><input id="gTotal" readonly placeholder="3 à 15"></div><div class="field"><label>Glycémie — valeur</label><input id="bGlucose" maxlength="3"></div><div class="field"><label>Unité</label><select id="bGlucoseUnit"><option>mg/dL</option><option>g/L</option><option>mmol/L</option></select></div><div class="field"><label>Diabète</label><div class="checks"><label class="check"><input type="checkbox" id="bDiabetic"> Diabétique</label><label class="check"><input type="checkbox" id="bInsulin"> Insulinodépendant(e)</label></div></div><div class="field"><label>Température (°C)</label><input id="bTemp" placeholder="00,0"></div><div class="field"><label>Prise</label><select id="bTempSite"><option>Tympanique</option><option>Axillaire</option><option>Buccale</option><option>Rectale</option></select></div></div>`;
if(k==='CO')return `<div class="formgrid">${groupHTML('CO Position')}${textField('Plainte / trauma','bComplaint2')}${textField('Circonstances','bCirc2')}${textField('Caractéristiques','bFeatures') }<div class="field full"><label>Localisation — sélectionner les zones concernées sur les schémas textuels</label><div class="bodymap"><div class="map"><b>FACE AVANT</b><p class="muted">Schéma corporel — sélection des zones</p>${['Tête','Épaule G','Épaule D','Thorax','Abdomen','Aine','Biceps G','Biceps D','Avant-bras G','Avant-bras D','Mains G','Mains D','Cuisses G','Cuisses D','Mollets G','Mollets D','Pieds G','Pieds D'].map(v=>`<label class="check"><input type="checkbox" data-group="CO Localisation" value="${v}">${v}</label>`).join('')}</div><div class="map"><b>FACE ARRIÈRE</b><p class="muted">Schéma corporel — sélection des zones</p>${['Tête arrière','Dos','Lombaires','Fesses G','Fesses D','Épaules G/D','Bras G/D','Mains G/D','Cuisses G/D','Mollets G/D','Pieds G/D'].map(v=>`<label class="check"><input type="checkbox" data-group="CO Localisation" value="${v}">${v}</label>`).join('')}</div></div></div><div class="field"><label>Intensité (1 à 10)</label><input id="bIntensity" type="number" min="1" max="10"></div>${textField('Durée','bDuration')}${textField('Allergies','bAllergy')}${textField('Médicaments déclarés','bMedication')}${textField('Passé médical / hospitalisations','bHistory')}${textField('Dernier repas','bMeal')}${textField('Événement ayant conduit à la situation','bEvent')}${textField('Traumatismes — précision / mécanisme','bTrauma',true)}${groupHTML('CO Traumatismes')}</div>`;
if(k==='S')return `<div class="actions no-print"><button class="btn" onclick="addSurveillance(${p.id})">＋ Ajouter une page de surveillance</button></div><div id="surveillanceList">${(p.bilan.surveillance||[{}]).map((s,i)=>surveillanceHTML(s,i)).join('')}</div><div class="section-title">DEVENIR DE LA PRISE EN CHARGE</div><div class="formgrid">${groupHTML('S État victime')}${groupHTML('S Devenir')}<div class="field full"><label>Commentaires / décharge</label><textarea id="bOutcomeNotes">${esc(p.bilan.outcomeNotes||'')}</textarea></div>${groupHTML('S Évacuation par')}<div class="field"><label>Centre hospitalier / clinique</label><input id="bHospital"></div><div class="field"><label>Heure de départ</label><input id="bDeparture" type="time"></div><div class="field full"><label>Autre transport (préciser)</label><input id="bTransportOther"></div><div class="field full"><label>Décharge de responsabilité — texte RP</label><textarea id="bWaiver">Je soussigné(e), déclare être informé(e) de la situation présentée dans le cadre de cette prise en charge RP et indique refuser la prise en charge et/ou le transport en milieu hospitalier à ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}.</textarea></div><div class="field"><label>Nom / signature (RP)</label><input id="bSignature"></div></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="print()">Imprimer le bilan complet</button></div>`;
return ''}
function surveillanceHTML(s,i){return `<div class="card" style="margin:10px 0;background:#0c1a27"><div class="section-title">SURVEILLANCE N° ${i+1}</div><div class="formgrid four">${[['Horaire','time'],['Fréquence respiratoire (mvt/min)','text'],['SpO₂ (%)','text'],['Amplitude / régularité respiratoire','text'],['Fréquence cardiaque (BPM)','text'],['Tension artérielle','text'],['TRC','text'],['Amplitude / régularité cardiaque','text'],['Glasgow (3–15)','number'],['Température','text'],['Glycémie','text']].map((a,j)=>`<div class="field"><label>${a[0]}</label><input data-surv="${i}" data-name="${a[0]}" type="${a[1]}" value="${esc(s[a[0]]||'')}"></div>`).join('')}</div></div>`}
function addSurveillance(id){if(!canCare()){alert('Accès refusé pour ce rôle.');return}let p=pecs.find(x=>x.id===id);p.bilan.surveillance=p.bilan.surveillance||[{}];p.bilan.surveillance.push({});saveAll();activeBilan='S';renderBilan(p)}
function loadBilanValues(p){let b=p.bilan||{};let section=b[activeBilan]||{};Object.entries(section).forEach(([id,val])=>{let el=$('#'+id);if(el)el.value=val});let checks=section.checks||{};document.querySelectorAll('#bilanForm input[type=checkbox]').forEach(el=>{el.checked=(checks[el.dataset.group]||[]).includes(el.value)});if(section.radio){let el=document.querySelector(`input[name="bTRC"][value="${CSS.escape(section.radio)}"]`);if(el)el.checked=true}if(activeBilan==='S'){(b.surveillance||[]).forEach((s,i)=>Object.entries(s).forEach(([k,v])=>{let el=[...document.querySelectorAll(`[data-surv="${i}"]`)].find(x=>x.dataset.name===k);if(el)el.value=v}));}}
function saveBilan(id){if(!canCare()){alert('Accès refusé pour ce rôle.');return}let p=pecs.find(x=>x.id===id),k=activeBilan,section={};document.querySelectorAll('#bilanForm input:not([type=checkbox]):not([type=radio]),#bilanForm textarea,#bilanForm select').forEach(el=>{if(el.id)section[el.id]=el.value});let checks={};document.querySelectorAll('#bilanForm input[type=checkbox]:checked').forEach(el=>(checks[el.dataset.group]??=[]).push(el.value));section.checks=checks;let radio=document.querySelector('input[name="bTRC"]:checked');if(radio)section.radio=radio.value;
if(k==='CI'&&['CI Sécurité'].some(g=>(checks[g]||[]).length)&&!$('#bSafety').value.trim()){alert('La justification de sécurité est obligatoire si une case est cochée.');return}
if(k==='S'){p.bilan.outcomeNotes=$('#bOutcomeNotes')?.value||'';p.bilan.surveillance=[...document.querySelectorAll('[data-surv]')].reduce((arr,el)=>{let i=+el.dataset.surv;arr[i]=arr[i]||{};arr[i][el.dataset.name]=el.value;return arr},[]);p.bilan.S=section}
else p.bilan[k]=section;
saveAll();alert('Rubrique enregistrée.');renderBilan(p)}
function calcGlasgow(){let a=+($('#gEye')?.value||0),b=+($('#gMotor')?.value||0),c=+($('#gVerbal')?.value||0);$('#gTotal').value=a&&b&&c?a+b+c:''}
function profilesPage(){if(!canAdmin()){go('home');return}$('#content').innerHTML=`<div class="grid"><div class="card span-4"><h3>CRÉER UN PROFIL</h3><div class="formgrid"><div class="field full"><label>Nom affiché</label><input id="newName"></div><div class="field full"><label>Identifiant</label><input id="newUser"></div><div class="field full"><label>Mot de passe de démonstration</label><input id="newPass" type="password"></div><div class="field full"><label>Habilitation</label><select id="newRole">${roles.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="full"><button class="btn primary" onclick="createProfile()">Créer le profil</button></div></div></div><div class="card span-8"><h3>PROFILS ENREGISTRÉS</h3><div class="tablewrap"><table><thead><tr><th>Nom</th><th>Identifiant</th><th>Rôle</th><th>Action</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.user)}</td><td>${esc(u.role)}</td><td>${u.id!==current.id?`<button class="btn small danger" onclick="removeProfile(${u.id})">Révoquer</button>`:'<span class="tag">Session active</span>'}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function createProfile(){if(!canAdmin()){alert('Accès réservé à l’administrateur.');return}let name=$('#newName').value.trim(),user=$('#newUser').value.trim(),pass=$('#newPass').value,role=$('#newRole').value;if(!name||!user||!pass){alert('Tous les champs sont obligatoires.');return}if(users.some(u=>u.user.toLowerCase()===user.toLowerCase())){alert('Cet identifiant existe déjà.');return}users.push({id:Date.now(),name,user,pass,role});auditEvent('Création de profil','Accès',user,'Rôle : '+role);saveAll();profilesPage()}
function removeProfile(id){if(!canAdmin()||id===current.id)return;if(confirm('Révoquer ce profil ?')){const revoked=users.find(u=>u.id===id);users=users.filter(u=>u.id!==id);auditEvent('Révocation de profil','Accès',id,'Rôle : '+(revoked?.role||''));saveAll();profilesPage()}}
function notificationsPage(){$('#content').innerHTML=`<div class="card"><h3>NOTIFICATIONS DE SERVICE</h3>${notifications.map(n=>`<div class="notice" style="margin:8px 0">${esc(n.text)} <small>— ${esc(n.date)}</small></div>`).join('')||'<p class="muted">Aucune notification.</p>'}<button class="btn small" onclick="notifications=[];saveAll();go('notifications')">Effacer les notifications</button></div>`}

 $('#content').innerHTML=`<div class="card"><h3>CATALOGUE PHARMACOLOGIQUE</h3><p class="muted">Référentiel documentaire RP. Les niveaux N1–N5 sont des repères internes, et non une classification réglementaire. La délivrance et les conditions réelles varient selon la spécialité, la dose et le pays.</p><div class="formgrid"><div class="field"><label>Recherche libre (molécule, catégorie, effet recherché ou effet secondaire)</label><input id="medSearch" aria-label="Rechercher un médicament" placeholder="Ex. nausées, douleur, somnolence…" oninput="renderMedications()"></div><div class="field"><label>Filtrer par niveau indicatif</label><select id="medLevel" onchange="renderMedications()"><option value="">Tous les niveaux</option>${['N1','N2','N3','N4','N5'].map(n=>`<option>${n}</option>`).join('')}</select></div></div><p class="muted" id="medCount"></p><div id="medResults"></div></div>`;
 renderMedications();
}
function renderMedications(){
 let q=normalizeSearch($('#medSearch')?.value),level=$('#medLevel')?.value;
 let found=medicationCatalog.filter(m=>(!level||m[6].includes(level))&&(!q||normalizeSearch(m.join(' ')).includes(q)));
 $('#medCount').setAttribute('aria-live','polite');$('#medCount').textContent=found.length+' catégorie(s) trouvée(s) sur '+medicationCatalog.length;
 $('#medResults').innerHTML=found.map(m=>`<details class="card" style="margin:10px 0"><summary style="cursor:pointer;font-weight:700">${esc(m[0])} <span class="tag">${esc(m[6])}</span></summary><div class="tablewrap" style="margin-top:12px"><table><tbody>${['Effet recherché','Molécules (exemples)','Effets secondaires','Cas pratique / conditions d’utilisation','Voies d’administration','Niveau indicatif RP'].map((label,i)=>`<tr><th style="width:190px">${label}</th><td>${esc(m[i+1])}</td></tr>`).join('')}</tbody></table></div></details>`).join('')||'<p class="muted">Aucun résultat.</p>';
}
const symptomSynonyms={
 "dyspnee":["essoufflement","gene respiratoire","difficulte a respirer"],
 "essoufflement":["dyspnee","gene respiratoire"],
 "cephalee":["maux de tete","mal de tete"],
 "maux de tete":["cephalee","mal de tete"],
 "fievre":["temperature elevee","febrile"],
 "toux":["tousser"],
 "fatigue":["asthenie","epuisement"],
 "vertiges":["etourdissements","malaise"],
 "douleur thoracique":["oppression thoracique","douleur poitrine","douleur au thorax"],
 "douleur poitrine":["douleur thoracique","oppression thoracique"],
 "oedeme":["gonflement","retention d eau"],
 "gonflement":["oedeme"],
 "nausee":["nausees","envie de vomir"],
 "diarrhee":["selles liquides"],
 "palpitation":["palpitations","battements irreguliers"],
 "demangeaison":["demangeaisons","prurit"],
 "douleur abdominale":["douleurs abdominales","mal au ventre","crampes abdominales"],
 "mal au ventre":["douleur abdominale","crampes abdominales"],
 "rougeur":["plaques rouges","eruption cutanee"],
 "perte de connaissance":["malaise","syncope"],
 "trouble de la vision":["vision trouble","baisse de vision"],
 "mal de gorge":["douleur a la gorge","douleur gorge"],
 "brulure urinaire":["brulures en urinant","picotements en urinant"],
 "insomnie":["troubles du sommeil"],
 "douleur articulaire":["douleurs articulaires"]
};
let selectedSymptoms=[];
function symptomKey(s){return normalizeSearch(s).replace(/[’']/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
const symptomLibrary=[...new Set(Object.values(symptomSynonyms).flat().concat(Object.keys(symptomSynonyms),diseases.flatMap(d=>d[2].split(/[,;:.()]/).map(s=>s.trim()).filter(s=>s.length>3))))].sort((a,b)=>a.localeCompare(b,'fr'));
function addSymptom(value){
 let term=String(value||'').trim();
 if(!term)return;
 if(!selectedSymptoms.some(t=>symptomKey(t)===symptomKey(term)))selectedSymptoms.push(term);
 $('#symptomInput').value='';
 renderSymptomChips();renderSymptomSuggestions();renderDiagnoses();
}
function removeSymptom(i){selectedSymptoms.splice(i,1);renderSymptomChips();renderSymptomSuggestions();renderDiagnoses()}
function renderSymptomChips(){
 $('#symptomChips').innerHTML=selectedSymptoms.map((t,i)=>`<button type="button" class="btn small" style="margin:3px;border-radius:22px" onclick="removeSymptom(${i})">${esc(t)} ×</button>`).join('')||'<span class="muted">Aucun symptôme ajouté.</span>';
}
function renderSymptomSuggestions(){
 const q=symptomKey($('#symptomInput')?.value||'');
 const target=$('#symptomSuggestions');if(!target)return;
 if(!q){target.innerHTML='<span class="muted">Saisissez un symptôme : les suggestions apparaissent immédiatement.</span>';return}
 const items=symptomLibrary.filter(x=>symptomKey(x).includes(q)&&!selectedSymptoms.some(t=>symptomKey(t)===symptomKey(x))).slice(0,8);
 target.innerHTML=items.map(x=>`<button type="button" class="btn small" style="margin:3px" onclick="addSymptom(decodeURIComponent('${encodeURIComponent(x)}'))">+ ${esc(x)}</button>`).join('')||'<span class="muted">Aucune suggestion exacte. Vous pouvez ajouter votre propre terme.</span>';
}
function onSymptomKey(event){
 if(event.key==='Enter'||event.key===','||event.key===';'){event.preventDefault();addSymptom($('#symptomInput').value)}
}
function diagnosesRank(){
 const pending=$('#symptomInput')?.value?.trim()||'';
 const terms=[...selectedSymptoms,...(pending?[pending]:[])].map(symptomKey).filter(x=>x.length>1);
 if(!terms.length)return [];
 return diseases.map((d,i)=>{
  const hay=symptomKey(d[0]+' '+d[2]);
  const hits=terms.filter(t=>{
   let candidates=[t,...(symptomSynonyms[t]||[]).map(symptomKey)];
   return candidates.some(c=>c.length>2&&hay.includes(c));
  });
  return {d,i,hits,score:hits.length};
 }).filter(x=>x.score).sort((a,b)=>b.score-a.score||a.d[0].localeCompare(b.d[0],'fr'));
}
function diagnosticsPage(){
 if(!canDoctor()){go('home');return}
 selectedSymptoms=[];
 $('#content').innerHTML=`<div class="card"><h3>EXPLORATEUR DE SYMPTÔMES · RP</h3><p class="muted">Suggestions instantanées issues des 80 fiches de pathologies. Classement par nombre de correspondances textuelles : ce n'est ni une probabilité ni un diagnostic.</p>
 <div class="field"><label>Ajouter un symptôme</label><input id="symptomInput" aria-label="Saisir un symptôme" autocomplete="off" placeholder="Tapez : toux, fièvre, vertiges…" oninput="renderSymptomSuggestions();renderDiagnoses()" onkeydown="onSymptomKey(event)"><div id="symptomSuggestions" style="margin:8px 0"></div><div class="actions"><button class="btn small" onclick="addSymptom($('#symptomInput').value)">+ Ajouter ce symptôme</button><button class="btn small" onclick="selectedSymptoms=[];$('#symptomInput').value='';renderSymptomChips();renderSymptomSuggestions();renderDiagnoses()">Effacer tout</button></div></div>
 <div class="field"><label>Symptômes retenus (cliquer pour retirer)</label><div id="symptomChips"></div></div>
 <div class="formgrid"><div class="field"><label>Filtrer les résultats par spécialité</label><select id="diagSpecialty" onchange="renderDiagnoses()"><option value="">Toutes les spécialités</option>${[...new Set(diseases.map(d=>d[1]))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Afficher</label><select id="diagLimit" onchange="renderDiagnoses()"><option value="10">10 propositions</option><option value="25">25 propositions</option><option value="80">Toutes les propositions</option></select></div></div>
 <h3>PROPOSITIONS EN TEMPS RÉEL</h3><p class="muted" id="diagCount"></p><div id="diagResults"></div>
 <hr><h3>VALIDATION MÉDICALE RP</h3><div class="formgrid"><div class="field"><label>Patient</label><select id="diagPatient"><option value="">Sélectionner un dossier</option>${patients.map(p=>`<option value="${p.id}">${esc(patientName(p))} — ${esc(p.dob)}</option>`).join('')}</select></div><div class="field"><label>Hypothèse modifiable</label><input id="diagHypothesis" placeholder="Sélectionner une piste ou saisir librement"></div><div class="field full"><label>Observations / justification</label><textarea id="diagComment" placeholder="Observations du médecin…"></textarea></div><div class="field"><label>Décision</label><select id="diagStatus"><option>À examiner</option><option>Validée par le médecin (RP)</option><option>Écartée par le médecin (RP)</option></select></div><div class="field" style="justify-content:end"><button class="btn primary" onclick="saveDiagnostic()">Enregistrer dans le dossier</button></div></div></div>`;
 renderSymptomChips();renderSymptomSuggestions();renderDiagnoses();
}
function renderDiagnoses(){
 const matches=diagnosesRank();
 const specialty=$('#diagSpecialty')?.value||'';
 const filtered=matches.filter(x=>!specialty||x.d[1]===specialty);
 const limit=Number($('#diagLimit')?.value||10);
 const terms=[...selectedSymptoms,...($('#symptomInput')?.value?.trim()||''?[ $('#symptomInput').value.trim() ]:[])];
 $('#diagCount').setAttribute('aria-live','polite');$('#diagCount').textContent=terms.length?`${filtered.length} correspondance(s) sur ${diseases.length} pathologies · actualisation à chaque saisie.`:`${diseases.length} pathologies disponibles. Commencez à taper pour afficher les propositions.`;
 $('#diagResults').innerHTML=filtered.slice(0,limit).map(({d,i,hits,score})=>`<div class="card" style="margin:8px 0"><div class="actions" style="justify-content:space-between;align-items:center"><b>${esc(d[0])}</b><span class="tag">${score}/${terms.length} terme(s) retrouvé(s)</span></div><p class="muted">${esc(d[1])}</p><p>${esc(d[2])}</p><p class="muted">Correspondances : ${hits.map(esc).join(' · ')}</p><button class="btn small" onclick="chooseDiagnosis(${i})">Retenir comme hypothèse RP</button></div>`).join('')||'<p class="muted">Aucune correspondance. Essayez un autre terme ou un synonyme.</p>';
}
function chooseDiagnosis(i){if(!canDoctor())return;$('#diagHypothesis').value=diseases[i][0];$('#diagHypothesis').focus()}
function saveDiagnostic(){
 if(!canDoctor())return;
 let id=Number($('#diagPatient').value),p=patients.find(x=>x.id===id);
 if(!p){alert('Sélectionnez un patient pour enregistrer une piste.');return}
 let hypothesis=$('#diagHypothesis').value.trim();
 if(!hypothesis){alert('Renseignez une hypothèse.');return}
 p.diagnosticHistory=p.diagnosticHistory||[];
 p.diagnosticHistory.push({date:new Date().toLocaleString('fr-FR'),symptoms:[...selectedSymptoms,...($('#symptomInput')?.value?.trim()?[ $('#symptomInput').value.trim() ]:[])].join(', '),hypothesis,comment:$('#diagComment').value,status:$('#diagStatus').value,doctor:current.name});
 saveAll();alert('Piste enregistrée dans le dossier RP du patient.');
}


const originalPatientDetail=patientDetail;
patientDetail=function(id){
 originalPatientDetail(id);
 let p=patients.find(x=>x.id===id);
 if(!p||!canDoctor()||!$('#content'))return;
 let entries=p.diagnosticHistory||[];
 $('#content').insertAdjacentHTML('beforeend',`<div class="card" style="margin-top:12px"><h3>HISTORIQUE DES PISTES MÉDICALES RP</h3>${entries.length?entries.slice().reverse().map(x=>`<p><b>${esc(x.hypothesis)}</b> <span class="tag">${esc(x.status)}</span><br><span class="muted">${esc(x.date)} · ${esc(x.doctor)} · Symptômes : ${esc(x.symptoms)} · ${esc(x.comment)}</span></p>`).join(''):'<p class="muted">Aucune piste enregistrée.</p>'}<button class="btn small" onclick="go('diagnostics')">Ouvrir la recherche de symptômes</button></div>`);
};

const sess=sessionStorage.getItem('lethe_session');if(sess){let u=users.find(x=>String(x.id)===sess);if(u){current=u;showApp()}}
saveAll();
</script>
</body></html>
